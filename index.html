<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STROOMpoint Interactive Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="main-screen map-only-screen">

    <aside class="location-panel" id="location-panel" aria-label="Location details">
      <div class="location-panel-image" aria-hidden="true">
        <button class="close-location" id="close-location" aria-label="Close panel">×</button>
        <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
          <!-- sky -->
          <rect width="360" height="160" fill="#C8E8F5"/>
          <!-- distant horizon glow -->
          <rect y="90" width="360" height="70" fill="#A3C9A8" opacity="0.4"/>
          <!-- water — diagonal river band -->
          <path d="M0 118 Q90 108 180 116 Q270 124 360 112 L360 160 L0 160Z" fill="#7BB8D4"/>
          <path d="M0 122 Q90 114 180 120 Q270 126 360 116 L360 128 Q270 122 180 124 Q90 118 0 126Z" fill="#9DCCE0" opacity="0.5"/>
          <!-- polder fields -->
          <path d="M0 92 Q60 86 120 94 Q180 102 240 90 Q300 80 360 88 L360 116 Q300 108 240 112 Q180 116 120 112 Q60 108 0 118Z" fill="#B8D9A0"/>
          <path d="M0 100 Q60 96 120 100 Q180 106 240 96 Q300 88 360 94" stroke="#8FC47A" stroke-width="1.2" fill="none" opacity="0.7"/>
          <path d="M120 112 Q180 116 240 108" stroke="#8FC47A" stroke-width="1" fill="none" opacity="0.5"/>
          <!-- far meadow -->
          <path d="M0 78 Q90 70 180 80 Q270 90 360 74 L360 94 Q300 84 240 90 Q180 96 120 88 Q60 80 0 88Z" fill="#C8E0B8"/>
          <!-- tree cluster — left -->
          <ellipse cx="52" cy="72" rx="18" ry="13" fill="#5A9E6B"/>
          <ellipse cx="44" cy="78" rx="13" ry="10" fill="#4E8E5E"/>
          <rect x="50" y="83" width="5" height="14" fill="#7A5C42"/>
          <!-- windmill — centre right -->
          <rect x="248" y="42" width="4" height="54" fill="#AABBB8"/>
          <circle cx="250" cy="44" r="3" fill="#8A9E9C"/>
          <!-- windmill blades -->
          <line x1="250" y1="44" x2="250" y2="16" stroke="#AABBB8" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="250" y1="44" x2="274" y2="50" stroke="#AABBB8" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="250" y1="44" x2="250" y2="70" stroke="#AABBB8" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
          <line x1="250" y1="44" x2="226" y2="38" stroke="#AABBB8" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
          <!-- farmhouse row -->
          <rect x="148" y="68" width="16" height="16" fill="#EDE8D8"/>
          <polygon points="148,68 156,58 164,68" fill="#D9654A" opacity="0.85"/>
          <rect x="169" y="72" width="12" height="12" fill="#EDE8D8"/>
          <polygon points="169,72 175,64 181,72" fill="#D9654A" opacity="0.7"/>
          <!-- church steeple far right -->
          <rect x="308" y="66" width="10" height="20" fill="#D8D0C0"/>
          <polygon points="308,66 313,54 318,66" fill="#B8B0A0"/>
          <!-- subtle grid of field ditches -->
          <line x1="80" y1="160" x2="100" y2="95" stroke="#8FC47A" stroke-width="0.8" opacity="0.4"/>
          <line x1="160" y1="160" x2="175" y2="95" stroke="#8FC47A" stroke-width="0.8" opacity="0.4"/>
          <line x1="240" y1="160" x2="252" y2="112" stroke="#8FC47A" stroke-width="0.8" opacity="0.4"/>
          <!-- label -->
          <text x="180" y="150" font-family="Inter, sans-serif" font-size="11" fill="rgba(0,0,0,0.35)" text-anchor="middle" letter-spacing="1">GROENE HART</text>
        </svg>
      </div>

      <div class="location-panel-body">
        <div class="location-title-block">
          <h2 data-location-name></h2>
          <div class="location-meta-row">
            <span class="location-town" data-location-town></span>
            <span class="hours-badge" data-location-hours></span>
          </div>
        </div>

        <p class="location-description" data-location-description></p>

        <span class="section-label">What we offer</span>
        <ul class="service-list" data-location-services></ul>

        <span class="section-label">Your matching cards</span>
        <div class="tag-row" data-location-tags></div>
      </div>

      <div class="location-panel-footer">
        <button class="learn-more-btn" id="learn-more-btn" type="button">
          Express interest
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="interest-overlay" id="interest-overlay" aria-hidden="true">
      <div class="interest-modal" role="dialog" aria-modal="true" aria-labelledby="interest-modal-title">
        <div class="interest-modal-header">
          <div>
            <p class="interest-company" id="interest-company"></p>
            <h3 id="interest-modal-title">Express your interest</h3>
          </div>
          <button class="interest-close" id="interest-close" aria-label="Close">×</button>
        </div>
        <p class="interest-description">Leave your name and email and the team will get in touch with more details about this opportunity.</p>
        <form class="interest-form" id="interest-form" novalidate>
          <label class="form-field">
            <span class="form-label">Full name</span>
            <input type="text" name="name" autocomplete="name" placeholder="Your name" required>
          </label>
          <label class="form-field">
            <span class="form-label">Email address</span>
            <input type="email" name="email" autocomplete="email" placeholder="your@email.com" required>
          </label>
          <button type="submit" class="interest-submit">Send enquiry</button>
        </form>
        <div class="interest-success" id="interest-success" hidden>
          <svg class="success-check-icon" width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="23" stroke="#038593" stroke-width="2.5"/>
            <path d="M16 26l7 7 13-14" stroke="#038593" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h3>You're all set</h3>
          <p>Thanks — the team at <strong id="success-company"></strong> will be in touch soon.</p>
          <button type="button" class="interest-done" id="interest-done">Done</button>
        </div>
      </div>
    </div>

    <div class="rfid-tray" id="rfid-tray">
      <div class="rfid-tray-cards" id="rfid-tray-cards">
        <span class="rfid-tray-empty">Scan a card to begin</span>
      </div>
      <div class="rfid-tray-controls" id="rfid-tray-controls">
        <span class="rfid-status-dot" id="rfid-status-dot"></span>
        <span class="rfid-status-text" id="rfid-status">Not connected</span>
        <button class="rfid-connect-btn" id="rfid-connect-btn">Connect Reader</button>
        <button class="rfid-cloud-btn" id="rfid-cloud-btn">Connect Web</button>
      </div>
    </div>

    <main class="map-shell" aria-label="Groene Hart opportunity map">
      <div class="table-top" id="table-top">
        <div id="map-container" class="map-container"></div>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
      import { initRFID, connectReader, connectCloudRelay, isRFIDSupported } from './js/rfid.js';
      import { subscribeToCards, removeCard } from './js/cards.js';
      import { initMap, updateMap, closeInfoPanel } from './js/map.js';
      import { getMatchedLocations } from './js/locations.js';

      const infoPanel = document.getElementById('location-panel');
      document.getElementById('close-location').addEventListener('click', () => closeInfoPanel(infoPanel));

      const interestOverlay = document.getElementById('interest-overlay');
      const interestCompany = document.getElementById('interest-company');
      const successCompany = document.getElementById('success-company');
      const interestForm = document.getElementById('interest-form');
      const interestSuccess = document.getElementById('interest-success');

      document.getElementById('learn-more-btn').addEventListener('click', () => {
        const name = document.querySelector('[data-location-name]').textContent;
        interestCompany.textContent = name;
        successCompany.textContent = name;
        interestForm.hidden = false;
        interestSuccess.hidden = true;
        interestOverlay.classList.add('is-open');
        interestOverlay.removeAttribute('aria-hidden');
      });

      function closeInterestModal() {
        interestOverlay.classList.remove('is-open');
        interestOverlay.setAttribute('aria-hidden', 'true');
      }

      document.getElementById('interest-close').addEventListener('click', closeInterestModal);
      document.getElementById('interest-done').addEventListener('click', closeInterestModal);
      interestOverlay.addEventListener('click', (e) => { if (e.target === interestOverlay) closeInterestModal(); });
      document.getElementById('interest-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = interestForm.querySelector('.interest-submit');
        const errorEl = interestForm.querySelector('.form-error') || (() => {
          const el = document.createElement('p');
          el.className = 'form-error';
          interestForm.appendChild(el);
          return el;
        })();
        errorEl.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';

        const data = new FormData(interestForm);
        const cardIds = currentCards.map(c => c.id);
        const matched = getMatchedLocations(cardIds);

        try {
          const res = await fetch('/api/send-map', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: data.get('name'),
              email: data.get('email'),
              cards: currentCards.map(c => ({ id: c.id, label: c.label })),
              locations: matched.map(l => ({
                name: l.name, town: l.town, hours: l.hours, services: l.services,
              })),
            }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || 'Could not send — please try again.');
          }
          interestForm.hidden = true;
          interestSuccess.hidden = false;
        } catch (err) {
          errorEl.textContent = err.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send enquiry';
        }
      });

      await initMap(document.getElementById('map-container'), infoPanel, null);

      let currentCards = [];

      const trayCards = document.getElementById('rfid-tray-cards');
      const connectBtn = document.getElementById('rfid-connect-btn');
      const cloudBtn = document.getElementById('rfid-cloud-btn');
      const statusDot = document.getElementById('rfid-status-dot');
      const statusText = document.getElementById('rfid-status');
      const rfidTray = document.getElementById('rfid-tray');
      const trayControls = document.getElementById('rfid-tray-controls');
      let readerConnected = false;

      function updateTrayVisibility(cards) {
        rfidTray.hidden = readerConnected && cards.length === 0;
      }

      function renderTray(cards) {
        updateTrayVisibility(cards);
        trayCards.innerHTML = '';
        for (const card of cards) {
          const chip = document.createElement('span');
          chip.className = 'rfid-chip';
          chip.innerHTML = `<span class="chip-icon">${card.icon}</span><span>${card.label}</span><button aria-label="Remove ${card.label}">&times;</button>`;
          chip.querySelector('button').addEventListener('click', () => removeCard(card.id));
          trayCards.appendChild(chip);
        }
      }

      subscribeToCards((cards) => {
        currentCards = cards;
        updateMap(cards, infoPanel, null);
        renderTray(cards);
      });

      function onStatus(status) {
        if (status === 'connected') {
          readerConnected = true;
          statusDot.classList.add('is-connected');
          statusText.textContent = 'Reader connected';
          connectBtn.classList.add('is-connected');
          trayControls.hidden = true;
          wifiForm.hidden = true;
          updateTrayVisibility([]);
        } else if (status === 'relay-connected') {
          readerConnected = false;
          rfidTray.hidden = false;
          trayControls.hidden = true;
          wifiForm.hidden = true;
        } else if (status === 'scanned') {
          statusText.textContent = 'Card scanned';
        } else if (status === 'disconnected') {
          readerConnected = false;
          rfidTray.hidden = false;
          trayControls.hidden = false;
          statusDot.classList.remove('is-connected');
          statusText.textContent = 'Reader disconnected';
          connectBtn.textContent = 'Reconnect';
          connectBtn.classList.remove('is-connected');
          connectBtn.disabled = false;
        } else if (status === 'unsupported') {
          connectBtn.hidden = true;
          statusText.textContent = 'Use Connect Web';
        } else if (status === 'error') {
          trayControls.hidden = false;
          statusText.textContent = 'Connection failed — try again';
        }
      }

      if (!isRFIDSupported()) onStatus('unsupported');

      connectBtn.addEventListener('click', () => connectReader(onStatus));
      cloudBtn.addEventListener('click', () => connectCloudRelay(onStatus));



      initRFID();
    </script>
  </body>
</html>
